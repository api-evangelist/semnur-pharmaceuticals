name: Semnur Pharmaceuticals
description: Semnur Pharmaceuticals, Inc. is a clinical-stage biopharmaceutical company developing non-opioid
  pain-management therapies. Its lead program, SP-102 (SEMDEXA), is a novel, non-opioid, preservative-free
  and particulate-free injectable corticosteroid gel formulation intended to treat moderate-to-severe chronic
  radicular pain (sciatica). Semnur is a subsidiary of Scilex Holding Company and is headquartered in the
  San Francisco Bay Area, California. As a pharmaceutical R&D company it publishes a corporate website,
  investor presentation, and scientific publications, but exposes no public developer API, documentation,
  or SDK surface.
